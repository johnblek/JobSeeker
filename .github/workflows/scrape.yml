name: Weekly Lead Finder

on:
  schedule:
    - cron: '0 9 * * 1'   # Every Monday at 9:00 AM UTC
  workflow_dispatch:        # Manual trigger button

permissions:
  contents: write

jobs:
  find-leads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests beautifulsoup4 google-genai

      - name: Run lead finder
        run: python lead_finder.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit results to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly leads — ${{ env.TODAY }}"
          file_pattern: "leads.db reports/*.md"
        env:
          TODAY: ${{ github.run_started_at }}
